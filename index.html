<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>महफ़िल</title>
    <!-- Favicon -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3209/3209990.png" type="image/png">
    
    <!-- Importing Hindi Retro Font (Rozha One) -->
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            background-color: #1a1a1a;
        }

        /* Fixed Background image layer */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1920&auto=format&fit=crop');
            filter: brightness(0.7) saturate(0.9) contrast(1.1);
            z-index: -1;
        }

        /* Center Big Hindi Title */
        .center-branding {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
            pointer-events: none;
        }

        .center-branding h1 {
            font-family: 'Rozha One', serif;
            font-size: 6.5rem;
            color: #ffffff !important;
            letter-spacing: 2px;
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.9), 0 2px 5px rgba(0, 0, 0, 0.9);
            line-height: 1.1;
        }

        @media (max-width: 768px) {
            .center-branding h1 {
                font-size: 4rem;
            }
        }

        /* Top Bar Styling */
        .top-bar {
            position: absolute;
            top: 25px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .time-display {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .online-counter {
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            box-shadow: 0 0 8px #2ecc71;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .category-selectors {
            display: flex;
            gap: 10px;
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #fff;
            color: #000;
            font-weight: 600;
        }

        /* Initial Start Overlay */
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: #fff;
            gap: 20px;
            backdrop-filter: blur(8px);
        }

        #startOverlay h1 {
            font-family: 'Rozha One', serif;
            font-size: 4rem;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        #startBtn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: transform 0.2s, background 0.2s;
        }

        #startBtn:hover {
            transform: scale(1.05);
            background: #c0392b;
        }

        /* Floating Glass Pill Player */
        .glass-player {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 730px;
            max-width: 95%;
            background: rgba(40, 20, 20, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .track-info {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 35%;
        }

        /* Spinning Vintage CD Vinyl Disc */
        .vinyl-art {
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #111 25%, #222 26%, #222 40%, #d4ac0d 41%, #d4ac0d 45%, #111 46%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            animation: spinVinyl 3s linear infinite;
            animation-play-state: paused;
            position: relative;
        }

        .vinyl-art.playing {
            animation-play-state: running;
        }

        .vinyl-center {
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
            border: 2px solid #333;
        }

        @keyframes spinVinyl {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .track-text h4 {
            color: #fff;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-text p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.75rem;
        }

        .player-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 42%;
            gap: 6px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .controls button:hover {
            transform: scale(1.15);
        }

        #playPauseBtn {
            width: 36px;
            height: 36px;
            background: #fff;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.75rem;
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #fff;
            border-radius: 2px;
        }

        /* --- Vintage Radio Volume Control --- */
        .vintage-volume {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 20%;
            justify-content: flex-end;
        }

        .vintage-volume span {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 75px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #d4ac0d;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        @media (max-width: 768px) {
            .top-bar {
                top: 15px;
                left: 20px;
                right: 20px;
                flex-direction: column;
                gap: 10px;
            }
            .glass-player {
                bottom: 20px;
                padding: 10px 15px;
                flex-direction: column;
                gap: 12px;
                width: 92%;
            }
            .track-info, .player-center, .vintage-volume {
                width: 100%;
                justify-content: center;
            }
            .controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Fixed Background Layer -->
    <div class="bg-layer"></div>

    <!-- Start Overlay -->
    <div id="startOverlay">
        <h1>महफ़िल</h1>
        <p>सा रे ग रहे, यादें संवरती रहें</p>
        <button id="startBtn" onclick="startMehfil()">▶ Play Radio</button>
    </div>

    <!-- Center Hindi Title -->
    <div class="center-branding">
        <h1>महफ़िल</h1>
    </div>

    <!-- Top Bar / Header -->
    <header class="top-bar">
        <div class="time-display" id="timeDisplay">--:-- --</div>
        <div class="online-counter">
            <span class="pulse-dot"></span>
            <span id="onlineCount">39</span> online
        </div>
        <div class="category-selectors">
            <button class="cat-btn active" onclick="switchCategory(event, '90s')">90s Classic</button>
            <button class="cat-btn" onclick="switchCategory(event, '20s')">20s Hits</button>
        </div>
    </header>

    <!-- HTML5 Audio Element -->
    <audio id="audioPlayer" preload="auto"></audio>

    <!-- Floating Glass Pill Player -->
    <div class="glass-player">
        <div class="track-info">
            <!-- Spinning Vintage CD Vinyl Disc -->
            <div class="vinyl-art" id="vinylDisc">
                <div class="vinyl-center"></div>
            </div>
            <div class="track-text">
                <h4 id="trackTitle">Loading...</h4>
                <p id="trackArtist">Mehfil Radio</p>
            </div>
        </div>
        
        <div class="player-center">
            <div class="controls">
                <button onclick="prevTrack()">⏮</button>
                <button id="playPauseBtn" onclick="togglePlay()">⏸</button>
                <button onclick="nextTrack()">⏭</button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar" onclick="seekTrack(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="totalTime">4:00</span>
            </div>
        </div>

        <!-- Vintage Radio Volume Control -->
        <div class="vintage-volume">
            <span>📻</span>
            <input type="range" min="0" max="100" value="80" class="volume-slider" id="volumeSlider" oninput="changeVolume(this.value)">
        </div>
    </div>

    <!-- App Logic Script -->
    <script>
        // Real Lo-Fi Hindi & Retro Music Audio Streams
        const playlists = {
            '90s': [
                { title: "90s Bollywood Retro Lofi Mix", artist: "Mehfil Classic", src: "https://stream.zeno.fm/f3wvbbqmdg8uv", duration: 240 },
                { title: "Vintage Melodies & Sadabahar Geet", artist: "Retro Beats", src: "https://stream.zeno.fm/0wrh0dfqwffuv", duration: 240 }
            ],
            '20s': [
                { title: "Modern Bollywood Chill & Lofi", artist: "Trending Mix", src: "https://stream.zeno.fm/f3wvbbqmdg8uv", duration: 240 },
                { title: "Acoustic & Romantic Vibes 20s", artist: "Fresh Beats", src: "https://stream.zeno.fm/0wrh0dfqwffuv", duration: 240 }
            ]
        };

        let currentCategory = '90s';
        let currentIndex = 0;
        let isPlaying = false;
        let currentSeconds = 0;
        let timerInterval = null;
        
        const audio = document.getElementById('audioPlayer');

        function startMehfil() {
            document.getElementById('startOverlay').style.display = 'none';
            loadAndPlayCurrentTrack();
        }

        function updateTrackInfoUI(track) {
            document.getElementById('trackTitle').innerText = track.title;
            document.getElementById('trackArtist').innerText = track.artist;
            document.getElementById('totalTime').innerText = formatTime(track.duration);
            currentSeconds = 0;
        }

        function loadAndPlayCurrentTrack() {
            const track = playlists[currentCategory][currentIndex];
            updateTrackInfoUI(track);
            
            audio.src = track.src;
            audio.volume = 0.8;
            audio.play().then(() => {
                isPlaying = true;
                document.getElementById('playPauseBtn').innerText = '⏸';
                document.getElementById('vinylDisc').classList.add('playing');
                startTimer();
            }).catch(e => {
                console.log("Playback error:", e);
            });
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPlaying) {
                    currentSeconds++;
                    const track = playlists[currentCategory][currentIndex];
                    if (currentSeconds >= track.duration) {
                        currentSeconds = 0;
                    }
                    updateProgressUI();
                }
            }, 1000);
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                document.getElementById('playPauseBtn').innerText = '▶';
                document.getElementById('vinylDisc').classList.remove('playing');
                isPlaying = false;
            } else {
                audio.play();
                document.getElementById('playPauseBtn').innerText = '⏸';
                document.getElementById('vinylDisc').classList.add('playing');
                isPlaying = true;
            }
        }

        audio.onended = function() {
            nextTrack();
        };

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlists[currentCategory].length;
            loadAndPlayCurrentTrack();
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlists[currentCategory].length) % playlists[currentCategory].length;
            loadAndPlayCurrentTrack();
        }

        function switchCategory(event, category) {
            currentCategory = category;
            currentIndex = 0;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadAndPlayCurrentTrack();
        }

        function changeVolume(val) {
            audio.volume = val / 100;
        }

        function updateProgressUI() {
            const track = playlists[currentCategory][currentIndex];
            const percent = Math.min(100, (currentSeconds / track.duration) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('currentTime').innerText = formatTime(currentSeconds);
        }

        function seekTrack(event) {
            const progressBar = document.getElementById('progressBar');
            const clickPosition = (event.clientX - progressBar.getBoundingClientRect().left) / progressBar.offsetWidth;
            const track = playlists[currentCategory][currentIndex];
            currentSeconds = Math.floor(track.duration * clickPosition);
            updateProgressUI();
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateClock() {
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('timeDisplay').innerText = timeString.toLowerCase();
        }
        setInterval(updateClock, 10000);
        updateClock();

        setInterval(() => {
            const countElement = document.getElementById('onlineCount');
            let currentCount = parseInt(countElement.innerText);
            let fluctuation = Math.floor(Math.random() * 5) - 2;
            let newCount = Math.max(25, currentCount + fluctuation);
            countElement.innerText = newCount;
        }, 5000);
    </script>
</body>
</html>
